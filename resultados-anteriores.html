<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resultados anteriores | Atlético Zabal</title>
  <link rel="icon" type="image/png" href="assets/escudo-zabal.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/club-highlights.css">
  <script src="assets/club-highlights.js" defer></script>
  <style>
    :root{--navy:#173a6a;--ink:#10203a;--muted:#627895;--line:#c9d8ea;--soft:#edf4fb;--yellow:#f4c800}
    *{box-sizing:border-box}
    body{margin:0;font-family:Outfit,sans-serif;background:var(--soft);color:var(--ink)}
    a{color:inherit}
    .top{background:var(--navy);border-bottom:5px solid var(--yellow);color:white}
    .bar,.wrap{max-width:1040px;margin:auto;padding:18px}
    .bar{display:flex;justify-content:space-between}
    .brand,.back{text-decoration:none;font-weight:800}
    .brand,.brand:visited,.brand:hover,.brand:active{color:#fff!important;font-size:20px;letter-spacing:-.02em}
    .brand span{color:var(--yellow)!important}
    .back{color:#dce7f5}
    .wrap{padding-top:44px;padding-bottom:70px}
    .eyebrow{margin:0 0 8px;color:#486788;font-weight:800;letter-spacing:.12em;font-size:14px;text-transform:uppercase}
    h1{margin:0;font-size:clamp(38px,6vw,62px);letter-spacing:-.04em}
    .intro{color:var(--muted);font-size:18px}
    .filters{display:flex;gap:9px;flex-wrap:wrap;margin:28px 0 22px}
    .filters button,.upcoming-link{border:1px solid var(--line);border-radius:999px;padding:9px 14px;font:700 14px Outfit;cursor:pointer}
    .filters button{background:#fff;color:var(--ink)}
    .filters button.active{background:var(--navy);color:white;border-color:var(--navy)}
    .upcoming-link{display:inline-flex;align-items:center;background:var(--yellow);color:var(--navy);border-color:var(--navy);text-decoration:none}
    .day{margin-top:28px}
    .day h2{font-size:15px;letter-spacing:.1em;color:#486788;text-transform:uppercase}
    .result{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px 18px;margin-top:9px}
    .team{font-size:13px;color:#486788;font-weight:800;text-transform:uppercase}
    .match{font-size:18px;font-weight:800;margin-top:2px}
    .meta{color:var(--muted);font-size:14px;margin-top:4px}
    .result-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}
    .score{min-width:72px;text-align:center;background:var(--navy);color:#fff;border-radius:11px;padding:9px 11px;font-size:23px;font-weight:800;line-height:1}
    .tag{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#edf4fb;color:#486788;font-size:12px;font-weight:800;white-space:nowrap}
    .tag.home{background:#fff4b0;color:#765f00}
    .official-link{display:inline-flex;align-items:center;padding:7px 10px;border-radius:8px;background:var(--navy);color:#fff!important;font-size:12px;font-weight:800;text-decoration:none;white-space:nowrap}
    .empty,.loading{margin-top:25px;color:var(--muted)}
    @media(max-width:620px){
      .bar,.wrap{padding-left:14px;padding-right:14px}
      .result{grid-template-columns:1fr;padding:14px;gap:11px}
      .result-actions{justify-content:flex-start}
      .match{font-size:16px}
      .score{font-size:21px}
    }
  </style>
</head>
<body>
  <header class="top"><div class="bar"><a class="brand" href="index.html">atlético<span>zabal</span></a><a class="back" href="index.html">← Inicio</a></div></header>
  <main class="wrap">
    <p class="eyebrow">Historial del club</p>
    <h1>Resultados anteriores</h1>
    <p class="intro">Partidos finalizados, ordenados del más reciente al más antiguo.</p>
    <div class="filters">
      <button class="active" data-filter="all">Todos</button>
      <button data-filter="home">Casa</button>
      <button data-filter="away">Fuera</button>
      <a class="upcoming-link" href="proximos-partidos.html">→ Próximos partidos</a>
    </div>
    <p class="loading">Actualizando resultados oficiales…</p>
    <p class="empty" hidden>No hay resultados con este filtro.</p>
  </main>
  <script>
    const main=document.querySelector('main.wrap');
    const empty=document.querySelector('.empty');
    const loading=document.querySelector('.loading');
    const results=[];
    const add=(parent,tag,className,text)=>{const element=document.createElement(tag);if(className)element.className=className;if(text!==undefined)element.textContent=text;parent.append(element);return element};
    const clubTeam=name=>/atl[eé]tico (zabal|atunara)|atunara atl[eé]tico/i.test(name||'');
    const feeds=[
      ['data/senior-rfaf.json','Sénior · Tercera Andaluza · Grupo único'],
      ['data/juvenil-dh-rfef.json','Juvenil · División de Honor · Grupo 4'],
      ['data/juvenil-b-rfaf.json','Juvenil B · Cuarta Andaluza · Grupo 4'],
      ['data/cadete-rfaf.json','Cadete A · Segunda Andaluza · Grupo único'],
      ['data/cadete-b-rfaf.json','Cadete B · Tercera Andaluza · Grupo 2'],
      ['data/infantil-a-rfaf.json','Infantil A · Segunda Andaluza · Grupo único'],
      ['data/alevin-a-rfaf.json','Alevín A · Segunda Andaluza · Grupo único'],
      ['data/alevin-c-rfaf.json','Alevín · Berrocal · Tercera Andaluza · Grupo 4'],
      ['data/alevin-atunara-a-rfaf.json','Alevín Atunara A · Cristian · Tercera Andaluza · Grupo 4'],
      ['data/alevin-zabal-c-rfaf.json','Alevín · David · Tercera Andaluza · Grupo 5'],
      ['data/alevin-atunara-b-rfaf.json','Alevín Atunara B · Adrián · Tercera Andaluza · Grupo 5'],
      ['data/benjamin-a-rfaf.json','Benjamín A · Segunda Andaluza · Grupo único'],
      ['data/benjamin-b-rfaf.json','Benjamín · J. del Río · Tercera Andaluza · Grupo 4']
    ];
    function applyFilter(){
      const selected=document.querySelector('.filters button.active').dataset.filter;
      let visibleTotal=0;
      document.querySelectorAll('.day').forEach(day=>{
        let visibleDay=0;
        day.querySelectorAll('.result').forEach(card=>{
          const visible=selected==='all'||card.dataset.side===selected;
          card.hidden=!visible;
          if(visible){visibleDay++;visibleTotal++}
        });
        day.hidden=!visibleDay;
      });
      empty.hidden=Boolean(visibleTotal);
    }
    document.querySelectorAll('.filters button').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('.filters button').forEach(other=>other.classList.remove('active'));
      button.classList.add('active');
      applyFilter();
    }));
    function appendResults(data,label){
      if(!Array.isArray(data.matches))return;
      data.matches.filter(match=>Array.isArray(match.score)&&match.score.length===2).forEach(match=>results.push({...match,label}));
    }
    function render(){
      results.sort((a,b)=>(b.date+' '+(b.time||'00:00')).localeCompare(a.date+' '+(a.time||'00:00')));
      const days=new Map();
      for(const match of results){
        let section=days.get(match.date);
        if(!section){
          section=add(main,'section','day');
          section.dataset.date=match.date;
          const date=new Date(match.date+'T12:00:00');
          add(section,'h2','',new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(date));
          days.set(match.date,section);
          main.insertBefore(section,loading);
        }
        const home=clubTeam(match.home);
        const card=add(section,'article','result');
        card.dataset.side=home?'home':'away';
        const info=add(card,'div','result-info');
        add(info,'div','team',match.label);
        add(info,'div','match',match.home+' – '+match.away);
        add(info,'div','meta',(match.time||'Hora no publicada')+' · '+(match.ground||'Campo no publicado'));
        const actions=add(card,'div','result-actions');
        add(actions,'strong','score',match.score[0]+'–'+match.score[1]);
        add(actions,'span','tag'+(home?' home':''),home?'🏠 CASA':'🚌 FUERA');
        if(match.actaUrl){
          const acta=add(actions,'a','official-link','Ver acta oficial');
          acta.href=match.actaUrl;
          acta.target='_blank';
          acta.rel='noopener';
        }
      }
    }
    Promise.allSettled(feeds.map(([path])=>fetch(path,{cache:'no-store'}).then(response=>response.ok?response.json():Promise.reject())))
      .then(loaded=>{
        loaded.forEach((item,index)=>{if(item.status==='fulfilled')appendResults(item.value,feeds[index][1])});
        render();
        loading.remove();
        applyFilter();
      });
  </script>
</body>
</html>
