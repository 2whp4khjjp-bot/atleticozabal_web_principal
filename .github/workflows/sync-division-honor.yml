name: Sincronizar calendario División de Honor
on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/sync-division-honor.js
      - run: |
          git config user.name "Atlético Zabal Calendar"
          git config user.email "calendar@atleticozabal.com"
          git add calendario-division-honor.ics
          git diff --cached --quiet || git commit -m "Actualiza calendario División de Honor"
          git push