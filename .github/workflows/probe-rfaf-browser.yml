name: Sincronizar Benjamín A · RFAF
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 1,4'
  push:
    paths:
      - '.github/workflows/probe-rfaf-browser.yml'
      - 'scripts/probe-rfaf-browser.js'
      - 'scripts/render-benjamin-a-ics.js'
      - 'scripts/validate-benjamin-a.js'
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Consultar calendario en navegador anónimo
        run: node scripts/probe-rfaf-browser.js
      - name: Generar calendario de suscripción
        run: node scripts/render-benjamin-a-ics.js
      - name: Validar página y suscripción
        run: node scripts/validate-benjamin-a.js
      - name: Guardar datos comprobados
        run: |
          git config user.name "Atlético Zabal · Actualizador"
          git config user.email "actions@github.com"
          git add data/benjamin-a-rfaf.json calendario-benjamin-a.ics
          git diff --cached --quiet || git commit -m "Actualiza partidos oficiales Benjamín A"
          git push
