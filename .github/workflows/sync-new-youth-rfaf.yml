name: Sincronizar nuevas categorías base RFAF
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync-new-youth-rfaf.js'
      - 'scripts/render-new-youth-ics.js'
      - '.github/workflows/sync-new-youth-rfaf.yml'
  schedule:
    - cron: '56 8 * * *'
    - cron: '56 9 * * *'
permissions:
  contents: write
concurrency:
  group: sync-new-youth-rfaf
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: [prebenjamin-polo, prebenjamin-c, prebenjamin-ab, alevin-atunara-mariano, bebe-ab]
    steps:
      - name: Comprobar hora peninsular
        id: window
        run: |
          offset="$(TZ=Europe/Madrid date +%z)"
          schedule='${{ github.event.schedule }}'
          if [ '${{ github.event_name }}' != 'schedule' ] || \
             { [ "$schedule" = '56 8 * * *' ] && [ "$offset" = '+0200' ]; } || \
             { [ "$schedule" = '56 9 * * *' ] && [ "$offset" = '+0100' ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - name: Instalar navegador
        if: steps.window.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Sincronizar cinco grupos y siete equipos
        if: steps.window.outputs.run == 'true'
        env:
          RFAF_GROUP: ${{ matrix.group }}
        run: node scripts/sync-new-youth-rfaf.js
      - name: Crear calendarios ICS
        if: steps.window.outputs.run == 'true'
        run: node scripts/render-new-youth-ics.js
      - name: Publicar calendarios verificados
        if: steps.window.outputs.run == 'true'
        run: |
          git config user.name "Atlético Zabal · Actualizador"
          git config user.email "actions@github.com"
          git add -A data/ calendario-*.ics
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sincroniza prebenjamines, alevín Mariano y bebés"
          bash scripts/push-calendar-update.sh

# Ejecución extraordinaria solicitada para cargar horarios oficiales.
