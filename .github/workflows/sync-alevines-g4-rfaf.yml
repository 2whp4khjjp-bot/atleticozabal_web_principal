name: Sincronizar Alevines Grupo 4 · RFAF
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8,9 * * *'
permissions:
  contents: write
concurrency:
  group: sync-alevines-g4-rfaf
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar hora peninsular
        id: window
        run: echo "run=$(TZ=Europe/Madrid date +%H | grep -qx 10 && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - name: Instalar Playwright y Chromium
        if: steps.window.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Consultar calendario y clasificación
        if: steps.window.outputs.run == 'true'
        run: node scripts/sync-alevines-g4-rfaf.js
      - name: Generar suscripciones
        if: steps.window.outputs.run == 'true'
        run: node scripts/render-alevines-g4-ics.js
      - name: Validar calendarios
        if: steps.window.outputs.run == 'true'
        run: node scripts/validate-alevines-g4.js
      - name: Publicar cambios oficiales
        if: steps.window.outputs.run == 'true'
        run: |
          git config user.name "Atlético Zabal · Actualizador"
          git config user.email "actions@github.com"
          git add data/alevin-c-rfaf.json data/alevin-atunara-a-rfaf.json calendario-alevin-c.ics calendario-alevin-atunara-a.ics
          if git diff --cached --quiet; then
            echo "No hay cambios oficiales que publicar"
            exit 0
          fi
          git commit -m "Actualiza Alevines del Grupo 4"
          bash scripts/push-calendar-update.sh
