name: Sincronizar Juvenil DH · RFEF
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-juvenil-dh-rfef.yml'
      - 'scripts/sync-juvenil-dh-rfef.js'
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
permissions:
  contents: write
concurrency:
  group: sync-juvenil-dh-rfef
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar hora peninsular
        id: window
        run: |
          offset="$(TZ=Europe/Madrid date +%z)"
          schedule='${{ github.event.schedule }}'
          if [ '${{ github.event_name }}' != 'schedule' ] || \
             { [ "$schedule" = '0 8 * * *' ] && [ "$offset" = '+0200' ]; } || \
             { [ "$schedule" = '0 9 * * *' ] && [ "$offset" = '+0100' ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - name: Instalar Playwright y Chromium
        if: steps.window.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Consultar Marcadores RFEF
        if: steps.window.outputs.run == 'true'
        run: node scripts/sync-juvenil-dh-rfef.js
      - name: Generar calendario de suscripción
        if: steps.window.outputs.run == 'true'
        run: node scripts/render-juvenil-dh-ics.js
      - name: Validar datos y calendario
        if: steps.window.outputs.run == 'true'
        run: node scripts/validate-juvenil-dh.js
      - name: Publicar cambios oficiales
        if: steps.window.outputs.run == 'true'
        run: |
          git config user.name "Atlético Zabal · Actualizador"
          git config user.email "actions@github.com"
          git add data/juvenil-dh-rfef.json calendario-division-honor.ics
          if git diff --cached --quiet; then
            echo "No hay cambios oficiales que publicar"
            exit 0
          fi
          git commit -m "Actualiza partidos oficiales Juvenil DH"
          bash scripts/push-calendar-update.sh
