name: Sincronizar Benjamín A RFAF
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-benjamin-a-rfaf
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar RFAF
        run: node scripts/sync-benjamin-a-rfaf.js
      - name: Guardar lectura
        run: |
          git config user.name "Atlético Zabal · Actualizador"
          git config user.email "actions@github.com"
          git add data/benjamin-a-rfaf-status.json
          if git diff --cached --quiet; then
            echo "No hay cambios oficiales que publicar"
            exit 0
          fi
          git commit -m "Actualiza lectura RFAF Benjamín A"
          bash scripts/push-calendar-update.sh
