name: Sincronizar Benjamín · Ángel · RFAF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-benjamin-angel-rfaf.js'
      - 'scripts/render-benjamin-angel-ics.js'
      - 'scripts/validate-benjamin-angel.js'
  schedule:
    - cron: '20 8 * * *'
    - cron: '20 9 * * *'
permissions:
  contents: write
concurrency:
  group: sync-benjamin-angel-rfaf
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar hora peninsular
        id: window
        run: |
          offset="$(TZ=Europe/Madrid date +%z)"
          schedule='${{ github.event.schedule }}'
          if [ '${{ github.event_name }}' != 'schedule' ] || \
             { [ "$schedule" = '20 8 * * *' ] && [ "$offset" = '+0200' ]; } || \
             { [ "$schedule" = '20 9 * * *' ] && [ "$offset" = '+0100' ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - name: Instalar Playwright y Chromium
        if: steps.window.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Consultar calendario y clasificación
        if: steps.window.outputs.run == 'true'
        run: node scripts/sync-benjamin-angel-rfaf.js
      - name: Generar calendario de suscripción
        if: steps.window.outputs.run == 'true'
        run: node scripts/render-benjamin-angel-ics.js
      - name: Validar página y suscripción
        if: steps.window.outputs.run == 'true'
        run: node scripts/validate-benjamin-angel.js
      - name: Publicar cambios oficiales
        if: steps.window.outputs.run == 'true'
        run: |
          git config user.name "Atlético Zabal · Actualizador"
          git config user.email "actions@github.com"
          git add data/benjamin-angel-rfaf.json calendario-benjamin-angel.ics
          if git diff --cached --quiet; then
            echo "No hay cambios oficiales que publicar"
            exit 0
          fi
          git commit -m "Actualiza partidos oficiales Benjamín · Ángel"
          bash scripts/push-calendar-update.sh
