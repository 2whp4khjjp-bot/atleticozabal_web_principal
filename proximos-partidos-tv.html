<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Próximos partidos · Vista TV | Atlético Zabal</title>
<link rel="icon" type="image/png" href="assets/escudo-zabal.png">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#102b50;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
*{box-sizing:border-box}
#screen{width:100%;height:100%;padding:22px 28px 16px 28px;background:#102b50}
#header{width:100%;height:112px;border-bottom:4px solid #f4c800;position:relative}
#crest{position:absolute;left:0;top:4px;width:86px;height:96px;object-fit:contain}
#heading{position:absolute;left:112px;top:10px}
#clubname{margin:0 0 4px 0;color:#f4c800;font-size:18px;font-weight:bold;letter-spacing:3px;text-transform:uppercase}
#title{margin:0;color:#fff;font-size:46px;line-height:48px;font-weight:bold}
#clockbox{position:absolute;right:0;top:8px;width:330px;text-align:right}
#clock{display:block;color:#f4c800;font-size:46px;line-height:48px;font-weight:bold}
#today{display:block;color:#c7d8ea;font-size:17px;margin-top:4px;text-transform:capitalize}
#days{width:100%;height:760px;padding-top:18px;overflow:hidden;white-space:nowrap}
.day{display:inline-block;vertical-align:top;width:32%;height:735px;margin-right:1.5%;padding:16px;background:#173a6a;border:1px solid #45678c;border-radius:16px;white-space:normal;overflow:hidden}
.day.last{margin-right:0}
.dayHead{height:62px;border-bottom:1px solid #45678c;margin-bottom:12px;position:relative}
.dayName{margin:0;color:#f4c800;font-size:27px;line-height:32px;font-weight:bold;text-transform:capitalize}
.dayCount{position:absolute;right:0;top:7px;color:#c7d8ea;font-size:14px;font-weight:bold}
.fixture{width:100%;min-height:128px;margin-bottom:10px;padding:13px 14px 12px 16px;background:#234f82;border-left:6px solid #f4c800;border-radius:10px;position:relative}
.category{padding-right:178px;color:#c7d8ea;font-size:14px;line-height:18px;font-weight:bold;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match{padding-right:178px;margin-top:5px;color:#fff;font-size:24px;line-height:28px;font-weight:bold}
.club{color:#f4c800}
.ground{padding-right:178px;margin-top:8px;color:#d9e5f0;font-size:15px;line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timebox{position:absolute;right:13px;top:18px;width:158px;text-align:right}
.timeLine{white-space:nowrap}
.time{display:inline-block;color:#fff;font-size:28px;line-height:30px;font-weight:bold;vertical-align:baseline}
.positions{display:inline-block;margin-left:9px;color:#f4c800;font-size:17px;line-height:22px;font-weight:bold;vertical-align:baseline}
.side{display:inline-block;margin-top:10px;padding:5px 9px;border:1px solid #95aac2;border-radius:12px;color:#fff;font-size:12px;font-weight:bold}
.side.home{background:#f4c800;border-color:#f4c800;color:#102b50}
#footer{position:absolute;left:28px;right:28px;bottom:12px;height:34px;color:#b8cae0;font-size:14px}
#status{float:left;line-height:30px}
#pager{position:absolute;left:45%;top:8px;height:18px;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:10px;background:#6c84a0}
.dot.active{width:28px;background:#f4c800}
#credit{float:right;line-height:30px;color:#fff;font-weight:bold}
.message{padding-top:220px;text-align:center;color:#c7d8ea;font-size:32px;font-weight:bold;white-space:normal}
@media screen and (max-width:1100px){
 #screen{padding:14px 18px 12px 18px}
 #header{height:95px}
 #crest{width:70px;height:80px}
 #heading{left:92px;top:7px}
 #clubname{font-size:14px}
 #title{font-size:36px;line-height:38px}
 #clockbox{width:260px}
 #clock{font-size:36px;line-height:38px}
 #today{font-size:14px}
 #days{height:650px;padding-top:12px}
 .day{height:625px;padding:12px}
 .dayName{font-size:22px}
 .fixture{min-height:108px;padding:10px 10px 9px 13px}
 .category{padding-right:145px;font-size:11px}
 .match{padding-right:145px;font-size:19px;line-height:22px}
 .ground{padding-right:145px;font-size:12px}
 .timebox{right:9px;width:134px}
 .time{font-size:23px}
 .positions{font-size:14px;margin-left:6px}
 #footer{left:18px;right:18px}
}
</style>
</head>
<body>
<div id="screen">
  <div id="header">
    <img id="crest" src="assets/escudo-zabal.png" alt="Atlético Zabal">
    <div id="heading"><div id="clubname">Atlético Zabal Linense</div><h1 id="title">Próximos partidos</h1></div>
    <div id="clockbox"><span id="clock">--:--</span><span id="today">Cargando…</span></div>
  </div>
  <div id="days"><div class="message">Actualizando partidos oficiales…</div></div>
  <div id="footer"><span id="status">Conectando con los calendarios…</span><span id="pager"></span><span id="credit">www.atleticozabal.com</span></div>
</div>
<script type="text/javascript">
(function(){
  var calendars=[
    ['data/senior-rfaf.json','Sénior · Tercera Andaluza','senior'],
    ['data/juvenil-dh-rfef.json','Juvenil · División de Honor','juvenil-dh'],
    ['data/cadete-rfaf.json','Cadete · Segunda Andaluza','cadete'],
    ['data/infantil-a-rfaf.json','Infantil A · Segunda Andaluza','infantil-a'],
    ['data/alevin-a-rfaf.json','Alevín A · Segunda Andaluza','alevin-a'],
    ['data/alevin-c-rfaf.json','Alevín B · Berrocal · Tercera Andaluza','alevines-g4'],
    ['data/alevin-atunara-a-rfaf.json','Alevín Atunara A · Cristian · Tercera Andaluza','alevines-g4'],
    ['data/alevin-zabal-c-rfaf.json','Alevín C · David · Tercera Andaluza','alevines-g5'],
    ['data/alevin-atunara-b-rfaf.json','Alevín Atunara B · Adrián · Tercera Andaluza','alevines-g5'],
    ['data/benjamin-a-rfaf.json','Benjamín A · Segunda Andaluza','benjamin-a']
  ];
  var staticFixtures=[{round:1,date:'2026-10-03',time:null,home:'Atlético Zabal B',away:'Atunara Atlético C.D.',ground:'Virgen del Carmen',label:'Benjamín B · Segunda Andaluza',standingsKey:'benjamin-b'}];
  var pages=[];
  var pageIndex=0;
  var rotationTimer=null;
  var clubWords=['ATLETICO ZABAL','ATLÉTICO ZABAL','ATLETICO ATUNARA','ATLÉTICO ATUNARA','ATUNARA ATLETICO','ATUNARA ATLÉTICO'];
  var daysNode=document.getElementById('days');
  var statusNode=document.getElementById('status');
  var pagerNode=document.getElementById('pager');
  var daysNames=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function pad(n){return n<10?'0'+n:String(n)}
  function todayKey(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function shiftKey(key,days){var p=key.split('-'),d=new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10),12,0,0);d.setDate(d.getDate()+days);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function sundayKey(key){var p=key.split('-'),d=new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10),12,0,0);return shiftKey(key,(7-d.getDay())%7)}
  function updateClock(){var d=new Date();document.getElementById('clock').innerHTML=pad(d.getHours())+':'+pad(d.getMinutes());document.getElementById('today').innerHTML=daysNames[d.getDay()]+' '+d.getDate()+' de '+months[d.getMonth()]}
  function isClub(name){var s=String(name||'').toUpperCase();for(var i=0;i<clubWords.length;i++){if(s.indexOf(clubWords[i])!==-1)return true}return false}
  function teamKey(name){return String(name||'').toUpperCase().replace(/[ÁÀÄÂ]/g,'A').replace(/[ÉÈËÊ]/g,'E').replace(/[ÍÌÏÎ]/g,'I').replace(/[ÓÒÖÔ]/g,'O').replace(/[ÚÙÜÛ]/g,'U').replace(/[^A-Z0-9]+/g,' ').replace(/^\s+|\s+$/g,'').replace(/\s+/g,' ')}
  function teamCompact(name){return teamKey(name).replace(/\s+/g,'')}
  function positionFor(standings,key,name){var list=standings&&standings.competitions&&standings.competitions[key],wanted=teamKey(name),compact=teamCompact(name),i;if(!list)return null;for(i=0;i<list.length;i++){if(teamKey(list[i].team)===wanted||teamCompact(list[i].team)===compact)return list[i].position}return null}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function cleanGround(value){var g=String(value||'Campo pendiente').replace(/\\,/g,',').replace(/\s*\(A\)\s*$/,'').replace(/^\s+|\s+$/g,'');var p=g.split(' - ');if(p.length>1)g=p.slice(1).join(' - ');return g.replace(/\s+/g,' ')}
  function formatDay(key){var p=key.split('-'),d=new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10),12,0,0);return daysNames[d.getDay()]+' '+parseInt(p[2],10)+' de '+months[parseInt(p[1],10)-1]}
  function matchName(home,away){return '<span'+(isClub(home)?' class="club"':'')+'>'+esc(home)+'</span> – <span'+(isClub(away)?' class="club"':'')+'>'+esc(away)+'</span>'}
  function rank(value){return value?' '+value+'º':' —'}
  function makeFixture(m){var home=isClub(m.home);return '<div class="fixture"><div class="category">'+esc(m.label)+' · J'+esc(m.round)+'</div><div class="match">'+matchName(m.home,m.away)+'</div><div class="ground">'+esc(cleanGround(m.ground))+'</div><div class="timebox"><div class="timeLine"><span class="time">'+esc(m.time||'—')+'</span><span class="positions">'+esc(rank(m.homePosition))+'–'+esc(rank(m.awayPosition))+'</span></div><div class="side'+(home?' home':'')+'">'+(home?'⌂ CASA':'▣ FUERA')+'</div></div></div>'}
  function render(){if(!pages.length){daysNode.innerHTML='<div class="message">No hay próximos partidos publicados.</div>';pagerNode.innerHTML='';return}var page=pages[pageIndex],html='',dots='',i,j,g;for(i=0;i<page.length;i++){g=page[i];html+='<div class="day'+(i===page.length-1?' last':'')+'"><div class="dayHead"><h2 class="dayName">'+esc(formatDay(g.date))+'</h2><span class="dayCount">'+g.matches.length+(g.matches.length===1?' partido':' partidos')+'</span></div>';for(j=0;j<g.matches.length;j++)html+=makeFixture(g.matches[j]);html+='</div>'}daysNode.innerHTML=html;for(i=0;i<pages.length;i++)dots+='<span class="dot'+(i===pageIndex?' active':'')+'"></span>';pagerNode.innerHTML=dots}
  function buildPages(fixtures){var grouped={},groups=[],i,m;fixtures.sort(function(a,b){var aa=a.date+' '+(a.time||'99:99'),bb=b.date+' '+(b.time||'99:99');return aa<bb?-1:(aa>bb?1:0)});for(i=0;i<fixtures.length;i++){m=fixtures[i];if(!grouped[m.date]){grouped[m.date]={date:m.date,matches:[]};groups.push(grouped[m.date])}grouped[m.date].matches.push(m)}if(groups.length>9)groups=groups.slice(0,9);pages=[];for(i=0;i<groups.length;i+=3)pages.push(groups.slice(i,i+3));pageIndex=0;render();if(rotationTimer)window.clearInterval(rotationTimer);if(pages.length>1)rotationTimer=window.setInterval(function(){pageIndex=(pageIndex+1)%pages.length;render()},18000)}
  function requestJSON(url,done){var xhr;try{xhr=new XMLHttpRequest()}catch(e){done(null);return}xhr.onreadystatechange=function(){if(xhr.readyState===4){if(xhr.status>=200&&xhr.status<300){try{done(JSON.parse(xhr.responseText))}catch(e){done(null)}}else done(null)}};xhr.open('GET',url+(url.indexOf('?')===-1?'?':'&')+'v='+(new Date().getTime()),true);try{xhr.setRequestHeader('Cache-Control','no-cache')}catch(e){}xhr.send(null)}
  function chooseWeek(fixtures,today){var end=sundayKey(today),selected=[],nextStart,key,seen={},unique=[],i,m;for(i=0;i<fixtures.length;i++){if(fixtures[i].date>=today&&fixtures[i].date<=end)selected.push(fixtures[i])}if(!selected.length){nextStart=shiftKey(end,1);end=shiftKey(end,7);for(i=0;i<fixtures.length;i++){if(fixtures[i].date>=nextStart&&fixtures[i].date<=end)selected.push(fixtures[i])}}for(i=0;i<selected.length;i++){m=selected[i];key=m.date+'|'+teamKey(m.home)+'|'+teamKey(m.away);if(!seen[key]){seen[key]=true;unique.push(m)}}return {matches:unique,end:end}}
  function loadData(){var today=todayKey(),fixtures=[],pending=calendars.length+1,sources=0,standings=null,i;for(i=0;i<staticFixtures.length;i++){if(staticFixtures[i].date>=today)fixtures.push(staticFixtures[i])}function finish(){var week,j,m,d;if(pending!==0)return;week=chooseWeek(fixtures,today);for(j=0;j<week.matches.length;j++){m=week.matches[j];m.homePosition=positionFor(standings,m.standingsKey,m.home);m.awayPosition=positionFor(standings,m.standingsKey,m.away)}buildPages(week.matches);d=new Date();statusNode.innerHTML='Semana hasta '+esc(formatDay(week.end))+' · Actualizado '+pad(d.getHours())+':'+pad(d.getMinutes())+' · '+sources+' calendarios'}requestJSON('data/tv-standings.json',function(data){standings=data;pending--;finish()});for(i=0;i<calendars.length;i++){(function(config){requestJSON(config[0],function(data){var j,m;if(data&&data.matches&&typeof data.matches.length==='number'){sources++;for(j=0;j<data.matches.length;j++){m=data.matches[j];if(m&&m.date>=today&&Object.prototype.toString.call(m.score)!=='[object Array]'){m.label=config[1];m.standingsKey=config[2];fixtures.push(m)}}}pending--;finish()})})(calendars[i])}}
  updateClock();window.setInterval(updateClock,30000);loadData();window.setInterval(loadData,300000);
})();
</script>
</body>
</html>
