<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Próximos partidos · Vista TV | Atlético Zabal</title>
<link rel="icon" type="image/png" href="assets/escudo-zabal.png">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#102b50;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
*{box-sizing:border-box}
#screen{position:relative;width:100%;height:100%;min-width:800px;min-height:560px;padding:14px 22px 12px;background:linear-gradient(145deg,#102b50,#06447d)}
#header{height:92px;border-bottom:4px solid #f4c800;position:relative}
#crest{position:absolute;left:0;top:0;width:70px;height:82px;object-fit:contain}
#heading{position:absolute;left:92px;top:5px}
#clubname{margin:0 0 3px;color:#f4c800;font-size:15px;font-weight:bold;letter-spacing:3px;text-transform:uppercase}
#title{margin:0;color:#fff;font-size:38px;line-height:40px;font-weight:bold}
#clockbox{position:absolute;right:0;top:3px;width:280px;text-align:right}
#clock{display:block;color:#f4c800;font-size:38px;line-height:40px;font-weight:bold}
#today{display:block;color:#fff;font-size:14px;margin-top:5px;text-transform:capitalize}
#days{position:absolute;left:22px;right:22px;top:118px;bottom:52px;overflow:hidden}
.dayHead{height:48px;position:relative}
.dayName{margin:0;color:#f4c800;font-size:25px;line-height:32px;font-weight:bold;text-transform:uppercase}
.dayCount{position:absolute;right:0;top:7px;color:#d9e5f0;font-size:14px;font-weight:bold}
.fixtures{position:absolute;left:0;right:0;top:48px;bottom:0;overflow:hidden}
.fixture{float:left;width:49.3%;height:calc(50% - 6px);margin-bottom:12px;padding:12px 14px 10px 16px;background:#0871c8;border-left:7px solid #f4c800;border-radius:12px;position:relative;overflow:hidden}
.fixture.odd{margin-right:1.4%}
.fixtureTop{height:27px;position:relative;padding-right:110px}
.category{color:#d8edff;font-size:13px;line-height:18px;font-weight:bold;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{position:absolute;right:0;top:-4px;color:#fff;font-size:27px;line-height:30px;font-weight:bold}
.teams{position:absolute;left:16px;right:14px;top:43px;bottom:45px;display:table;width:calc(100% - 30px)}
.teamRow{display:table-row;color:#fff;font-size:22px;line-height:25px;font-weight:bold}
.teamName,.teamPos{display:table-cell;vertical-align:middle;padding:1px 0}
.teamName{padding-right:14px}
.teamPos{width:52px;text-align:right;color:#d8edff;white-space:nowrap;font-size:16px}
.teamRow.ours .teamName,.teamRow.ours .teamPos,.coachName{color:#f4c800;text-shadow:0 1px 0 #173a6a}
.fixtureFoot{position:absolute;left:16px;right:14px;bottom:10px;height:28px;border-top:1px solid rgba(255,255,255,.25);padding-top:7px}
.ground{display:block;margin-right:105px;color:#d9e5f0;font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{position:absolute;right:0;top:5px;padding:4px 8px;border:1px solid #95aac2;border-radius:12px;color:#fff;font-size:11px;font-weight:bold}
.side.home{background:#f4c800;border-color:#f4c800;color:#102b50}
#footer{position:absolute;left:22px;right:22px;bottom:8px;height:34px;color:#b8cae0;font-size:12px}
#status{float:left;line-height:28px}
#pager{position:absolute;left:47%;top:8px;height:16px;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:9px;background:#6c84a0}
.dot.active{width:25px;background:#f4c800}
#credit{float:right;line-height:28px;color:#f4c800;font-size:17px;font-weight:bold;letter-spacing:1px}
.message{padding-top:190px;text-align:center;color:#c7d8ea;font-size:28px;font-weight:bold;white-space:normal}
@media screen and (min-width:1500px) and (min-height:850px){
 #screen{padding:22px 30px 16px}
 #header{height:120px}
 #crest{width:92px;height:108px}
 #heading{left:120px;top:8px}
 #clubname{font-size:19px}
 #title{font-size:52px;line-height:54px}
 #clockbox{width:360px;top:7px}
 #clock{font-size:52px;line-height:54px}
 #today{font-size:18px}
 #days{left:30px;right:30px;top:154px;bottom:68px}
 .dayHead{height:62px}
 .dayName{font-size:34px;line-height:42px}
 .dayCount{font-size:17px;top:11px}
 .fixtures{top:62px}
 .fixture{height:calc(50% - 9px);margin-bottom:18px;padding:18px 20px 14px 22px;border-left-width:9px;border-radius:16px}
 .fixtureTop{height:36px;padding-right:145px}
 .category{font-size:17px;line-height:23px}
 .time{font-size:38px;line-height:40px}
 .teams{left:22px;right:20px;top:60px;bottom:58px;width:calc(100% - 42px)}
 .teamRow{font-size:31px;line-height:34px}
 .teamPos{width:68px;font-size:21px}
 .fixtureFoot{left:22px;right:20px;bottom:14px;height:34px;padding-top:9px}
 .ground{margin-right:130px;font-size:17px;line-height:21px}
 .side{top:7px;padding:6px 11px;font-size:14px}
 #footer{left:30px;right:30px;bottom:12px;height:42px;font-size:15px}
 #status,#credit{line-height:36px}
 #credit{font-size:23px}
}
</style>
</head>
<body>
<div id="screen">
  <div id="header">
    <img id="crest" src="assets/escudo-zabal.png" alt="Atlético Zabal">
    <div id="heading"><div id="clubname">Atlético Zabal Linense</div><h1 id="title">Próximos partidos</h1></div>
    <div id="clockbox"><span id="clock">--:--</span><span id="today">Cargando…</span></div>
  </div>
  <div id="days"><div class="message">Actualizando partidos oficiales…</div></div>
  <div id="footer"><span id="status">Conectando con los calendarios…</span><span id="pager"></span><span id="credit">www.atleticozabal.com</span></div>
</div>
<script type="text/javascript">
(function(){
  var calendars=[
    ['data/senior-rfaf.json','Sénior · Tercera Andaluza','senior'],
    ['data/juvenil-dh-rfef.json','Juvenil · División de Honor','juvenil-dh'],
    ['data/cadete-rfaf.json','Cadete A · Segunda Andaluza','cadete'],
    ['data/cadete-b-rfaf.json','Cadete · Machuca · Tercera Andaluza · Grupo 2','cadete-b'],
    ['data/infantil-a-rfaf.json','Infantil A · Segunda Andaluza','infantil-a'],
    ['data/alevin-a-rfaf.json','Alevín A · Segunda Andaluza','alevin-a'],
    ['data/alevin-c-rfaf.json','Alevín · Berrocal · Tercera Andaluza','alevines-g4'],
    ['data/alevin-atunara-a-rfaf.json','Alevín Atunara A · Cristian · Tercera Andaluza','alevines-g4'],
    ['data/alevin-zabal-c-rfaf.json','Alevín · David · Tercera Andaluza','alevines-g5'],
    ['data/alevin-atunara-b-rfaf.json','Alevín Atunara B · Adrián · Tercera Andaluza','alevines-g5'],
    ['data/benjamin-a-rfaf.json','Benjamín A · Segunda Andaluza','benjamin-a'],
    ['data/benjamin-b-rfaf.json','Benjamín · J. del Río · Tercera Andaluza','benjamin-b']
  ];
  var staticFixtures=[];
  var pages=[];
  var pageIndex=0;
  var rotationTimer=null;
  var clubWords=['ATLETICO ZABAL','ATLÉTICO ZABAL','ATLETICO ATUNARA','ATLÉTICO ATUNARA','ATUNARA ATLETICO','ATUNARA ATLÉTICO'];
  var coachWords=['BERROCAL','CRISTIAN','DAVID','ADRIÁN','MACHUCA','J. DEL RÍO'];
  var daysNode=document.getElementById('days');
  var statusNode=document.getElementById('status');
  var pagerNode=document.getElementById('pager');
  var daysNames=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function pad(n){return n<10?'0'+n:String(n)}
  function todayKey(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function isUpcoming(m,today){var kickoff;if(!m||Object.prototype.toString.call(m.score)==='[object Array]'||m.date<today)return false;if(m.date>today||!/^\d{2}:\d{2}$/.test(m.time||''))return true;kickoff=new Date(m.date+'T'+m.time+':00');return new Date().getTime()<kickoff.getTime()+2*60*60*1000}
  function shiftKey(key,days){var p=key.split('-'),d=new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10),12,0,0);d.setDate(d.getDate()+days);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function sundayKey(key){var p=key.split('-'),d=new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10),12,0,0);return shiftKey(key,(7-d.getDay())%7)}
  function updateClock(){var d=new Date();document.getElementById('clock').innerHTML=pad(d.getHours())+':'+pad(d.getMinutes());document.getElementById('today').innerHTML=daysNames[d.getDay()]+' '+d.getDate()+' de '+months[d.getMonth()]}
  function isClub(name){var s=String(name||'').toUpperCase();for(var i=0;i<clubWords.length;i++){if(s.indexOf(clubWords[i])!==-1)return true}return false}
  function teamKey(name){return String(name||'').toUpperCase().replace(/[ÁÀÄÂ]/g,'A').replace(/[ÉÈËÊ]/g,'E').replace(/[ÍÌÏÎ]/g,'I').replace(/[ÓÒÖÔ]/g,'O').replace(/[ÚÙÜÛ]/g,'U').replace(/[^A-Z0-9]+/g,' ').replace(/^\s+|\s+$/g,'').replace(/\s+/g,' ')}
  function teamCompact(name){return teamKey(name).replace(/\s+/g,'')}
  function positionFor(standings,key,name){var list=standings&&standings.competitions&&standings.competitions[key],wanted=teamKey(name),compact=teamCompact(name),i;if(!list)return null;for(i=0;i<list.length;i++){if(teamKey(list[i].team)===wanted||teamCompact(list[i].team)===compact)return list[i].position}return null}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function cleanGround(value){var g=String(value||'Campo pendiente').replace(/\\,/g,',').replace(/\s*\(A\)\s*$/,'').replace(/^\s+|\s+$/g,'');var p=g.split(' - ');if(p.length>1)g=p.slice(1).join(' - ');return g.replace(/\s+/g,' ')}
  function formatDay(key){var p=key.split('-'),d=new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10),12,0,0);return daysNames[d.getDay()]+' '+parseInt(p[2],10)+' '+months[parseInt(p[1],10)-1]}
  function categoryName(label){var parts=String(label||'').split(/\s*·\s*/),html=[],i;for(i=0;i<parts.length;i++)html.push(coachWords.indexOf(parts[i].toUpperCase())!==-1?'<span class="coachName">'+esc(parts[i])+'</span>':esc(parts[i]));return html.join(' · ')}
  function rankLabel(value){return value?value+'.º':'—'}
  function teamRow(name,position){return '<div class="teamRow'+(isClub(name)?' ours':'')+'"><span class="teamName">'+esc(name)+'</span><span class="teamPos">'+esc(rankLabel(position))+'</span></div>'}
  function makeFixture(m,index){var home=isClub(m.home);return '<div class="fixture'+(index%2===0?' odd':'')+'"><div class="fixtureTop"><div class="category">'+categoryName(m.label)+' · J'+esc(m.round)+'</div><span class="time">'+esc(m.time||'—')+'</span></div><div class="teams">'+teamRow(m.home,m.homePosition)+teamRow(m.away,m.awayPosition)+'</div><div class="fixtureFoot"><span class="ground">'+esc(cleanGround(m.ground))+'</span><span class="side'+(home?' home':'')+'">'+(home?'⌂ CASA':'▣ FUERA')+'</span></div></div>'}
  function render(){if(!pages.length){daysNode.innerHTML='<div class="message">No hay próximos partidos publicados.</div>';pagerNode.innerHTML='';return}var page=pages[pageIndex],html='',dots='',i,countText;countText=page.matches.length+(page.matches.length===1?' partido':' partidos');if(page.dayParts>1)countText+=' · bloque '+page.dayPart+' de '+page.dayParts;countText+=' · pantalla '+(pageIndex+1)+' de '+pages.length;html='<div class="dayHead"><h2 class="dayName">'+esc(formatDay(page.date))+'</h2><span class="dayCount">'+esc(countText)+'</span></div><div class="fixtures">';for(i=0;i<page.matches.length;i++)html+=makeFixture(page.matches[i],i);html+='</div>';daysNode.innerHTML=html;for(i=0;i<pages.length;i++)dots+='<span class="dot'+(i===pageIndex?' active':'')+'"></span>';pagerNode.innerHTML=dots}
  function buildPages(fixtures){var grouped={},groups=[],i,j,m,g,totalParts;fixtures.sort(function(a,b){var aa=a.date+' '+(a.time||'99:99'),bb=b.date+' '+(b.time||'99:99');return aa<bb?-1:(aa>bb?1:0)});for(i=0;i<fixtures.length;i++){m=fixtures[i];if(!grouped[m.date]){grouped[m.date]={date:m.date,matches:[]};groups.push(grouped[m.date])}grouped[m.date].matches.push(m)}if(groups.length>9)groups=groups.slice(0,9);pages=[];for(i=0;i<groups.length;i++){g=groups[i];totalParts=Math.ceil(g.matches.length/4);for(j=0;j<g.matches.length;j+=4)pages.push({date:g.date,matches:g.matches.slice(j,j+4),total:g.matches.length,dayPart:Math.floor(j/4)+1,dayParts:totalParts})}pageIndex=0;render();if(rotationTimer)window.clearInterval(rotationTimer);if(pages.length>1)rotationTimer=window.setInterval(function(){pageIndex=(pageIndex+1)%pages.length;render()},12000)}
  function requestJSON(url,done){var xhr;try{xhr=new XMLHttpRequest()}catch(e){done(null);return}xhr.onreadystatechange=function(){if(xhr.readyState===4){if(xhr.status>=200&&xhr.status<300){try{done(JSON.parse(xhr.responseText))}catch(e){done(null)}}else done(null)}};xhr.open('GET',url+(url.indexOf('?')===-1?'?':'&')+'v='+(new Date().getTime()),true);try{xhr.setRequestHeader('Cache-Control','no-cache')}catch(e){}xhr.send(null)}
  function chooseWeek(fixtures,today){var end=sundayKey(today),selected=[],nextStart,key,seen={},unique=[],i,m;for(i=0;i<fixtures.length;i++){if(fixtures[i].date>=today&&fixtures[i].date<=end)selected.push(fixtures[i])}if(!selected.length){nextStart=shiftKey(end,1);end=shiftKey(end,7);for(i=0;i<fixtures.length;i++){if(fixtures[i].date>=nextStart&&fixtures[i].date<=end)selected.push(fixtures[i])}}for(i=0;i<selected.length;i++){m=selected[i];key=m.date+'|'+teamKey(m.home)+'|'+teamKey(m.away);if(!seen[key]){seen[key]=true;unique.push(m)}}return {matches:unique,end:end}}
  function loadData(){var today=todayKey(),fixtures=[],pending=calendars.length+1,sources=0,standings=null,i;for(i=0;i<staticFixtures.length;i++){if(isUpcoming(staticFixtures[i],today))fixtures.push(staticFixtures[i])}function finish(){var week,j,m,d;if(pending!==0)return;week=chooseWeek(fixtures,today);for(j=0;j<week.matches.length;j++){m=week.matches[j];m.homePosition=positionFor(standings,m.standingsKey,m.home);m.awayPosition=positionFor(standings,m.standingsKey,m.away)}buildPages(week.matches);d=new Date();statusNode.innerHTML='Semana hasta '+esc(formatDay(week.end))+' · Actualizado '+pad(d.getHours())+':'+pad(d.getMinutes())+' · '+sources+' calendarios'}requestJSON('data/tv-standings.json',function(data){standings=data;pending--;finish()});for(i=0;i<calendars.length;i++){(function(config){requestJSON(config[0],function(data){var j,m;if(data&&data.matches&&typeof data.matches.length==='number'){sources++;for(j=0;j<data.matches.length;j++){m=data.matches[j];if(isUpcoming(m,today)){m.label=config[1];m.standingsKey=config[2];fixtures.push(m)}}}pending--;finish()})})(calendars[i])}}
  updateClock();window.setInterval(updateClock,30000);loadData();window.setInterval(loadData,300000);
})();
</script>
</body>
</html>
