#title{margin:0;color:#fff;font-size:38px;line-height:40px;font-weight:bold}
#clockbox{position:absolute;right:0;top:3px;width:280px;text-align:right}
#clock{display:block;color:#f4c800;font-size:38px;line-height:40px;font-weight:bold}
#today{display:block;color:#fff;font-size:14px;margin-top:5px;text-transform:capitalize}
#countdownPanel{position:absolute;left:22px;right:22px;top:112px;height:118px;padding:8px 18px;background:#f4c800;color:#102b50;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.countdownInfo{width:100%;height:100%;min-width:0;padding:7px 12px;background:#f4c800;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.countdownTitle{color:#102b50;font-size:18px;line-height:21px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase}
#countdown{display:flex;align-items:flex-start;justify-content:center;gap:7px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1}
.countGroup{display:flex;flex-direction:column;align-items:center;min-width:62px;padding:4px 5px 5px;border-radius:8px}
.countGroup:nth-child(1){background:#ffe66a}
.countGroup:nth-child(3){background:#ffdf45}
.countGroup:nth-child(5){background:#f8d51e}
.countGroup:nth-child(7){background:#edc400}
.countGroup:after{display:block;margin-top:2px;color:#102b50;font-size:9px;line-height:10px;font-weight:900;letter-spacing:.8px}
.countGroup:nth-child(1):after{content:"DÍAS"}
.countGroup:nth-child(3):after{content:"HRS"}
.countGroup:nth-child(5):after{content:"MIN"}
.countGroup:nth-child(7):after{content:"SEG"}
.countValue{display:flex;align-items:center;justify-content:center;width:62px;height:40px;border-radius:7px;background:transparent;color:#102b50;font-size:32px;line-height:40px;font-weight:900;letter-spacing:.3px}
.countJoin{align-self:flex-start;margin-top:13px;color:#102b50;font-size:21px;line-height:27px;font-weight:900}
.countPlain{color:#102b50;font-size:20px;font-weight:900}
#days{position:absolute;left:22px;right:22px;top:244px;bottom:52px;overflow:hidden}
.dayHead{height:48px;position:relative}
.dayName{margin:0;color:#f4c800;font-size:25px;line-height:32px;font-weight:bold;text-transform:uppercase}
.dayCount{position:absolute;right:0;top:7px;color:#d9e5f0;font-size:14px;font-weight:bold}
.fixtures{position:absolute;left:0;right:0;top:48px;bottom:0;overflow:hidden}
.fixture{float:left;width:49.3%;height:calc(50% - 6px);margin-bottom:12px;padding:12px 14px 10px 16px;background:#0871c8;border-left:7px solid #f4c800;border-radius:12px;position:relative;overflow:hidden}
.fixture.odd{margin-right:1.4%}
.fixtures.compact .fixture{height:190px;margin-bottom:0}
.fixtures.single .fixture{width:100%;height:190px;margin-right:0;margin-bottom:0}
.fixtureTop{height:27px;position:relative;padding-right:165px}
.category{color:#d8edff;font-size:13px;line-height:18px;font-weight:bold;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{position:absolute;right:0;top:-6px;color:#fff;font-size:36px;line-height:38px;font-weight:900}
.time.final{color:#f4c800;white-space:nowrap}
.resultMark{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;margin-left:5px;border-radius:50%;font-size:16px;line-height:1;vertical-align:middle}
.resultMark.win{background:#54df8a;color:#102b50}
.resultMark.loss{background:#ef5b62;color:#fff}
.teams{position:absolute;left:16px;right:14px;top:48px;bottom:12px;display:flex;flex-direction:column;justify-content:center;gap:5px;width:calc(100% - 30px)}
.teamRow{display:block;color:#fff;font-size:22px;line-height:25px;font-weight:bold}
.teamName{display:block;vertical-align:middle;padding:1px 0;padding-right:14px}
.teamRow.ours .teamName,.coachName{color:#f4c800;text-shadow:0 1px 0 #173a6a}

#footer{position:absolute;left:22px;right:22px;bottom:8px;height:34px;color:#b8cae0;font-size:12px}
#status{float:left;line-height:28px}
#pager{position:absolute;left:47%;top:8px;height:16px;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:9px;background:#6c84a0}
.dot.active{width:25px;background:#f4c800}
#credit{float:right;line-height:28px;color:#f4c800;font-size:17px;font-weight:bold;letter-spacing:1px}
.message{padding-top:190px;text-align:center;color:#c7d8ea;font-size:28px;font-weight:bold;white-space:normal}
@media screen and (min-width:1500px) and (min-height:850px){
 #screen{padding:22px 30px 16px}
 #header{height:120px}
 #crest{width:92px;height:108px}
 #heading{left:120px;top:8px}
 #clubname{font-size:19px}
 #title{font-size:52px;line-height:54px}
 #clockbox{width:360px;top:7px}
 #clock{font-size:52px;line-height:54px}
 #today{font-size:18px}
 #countdownPanel{left:30px;right:30px;top:154px;height:132px;padding:9px 22px}
 .countdownInfo{gap:5px;padding:8px 16px}
 .countdownTitle{font-size:20px;line-height:23px}
 #countdown{gap:9px}
 .countGroup{min-width:72px;padding:5px 6px 6px}
 .countGroup:after{font-size:10px;line-height:11px}
 .countValue{width:72px;height:46px;font-size:37px;line-height:46px}
 .countJoin{margin-top:10px;font-size:24px;line-height:31px}
 #days{left:30px;right:30px;top:308px;bottom:68px}
 .dayHead{height:62px}
 .dayName{font-size:34px;line-height:42px}
 .dayCount{font-size:17px;top:11px}
 .fixtures{top:62px}
 .fixture{height:calc(50% - 9px);margin-bottom:18px;padding:18px 20px 14px 22px;border-left-width:9px;border-radius:16px}
 .fixtureTop{height:36px;padding-right:200px}
 .resultMark{width:28px;height:28px;margin-left:7px;font-size:21px}
 .category{font-size:17px;line-height:23px}
 .time{font-size:46px;line-height:48px}
 .teams{left:22px;right:20px;top:62px;bottom:18px;width:calc(100% - 42px);gap:7px}
 .teamRow{font-size:31px;line-height:36px}
 .fixtures.compact .fixture,.fixtures.single .fixture{height:220px}
 
 .teams{bottom:18px}
 #footer{left:30px;right:30px;bottom:12px;height:42px;font-size:15px}
 #status,#credit{line-height:36px}
 #credit{font-size:23px}
}
</style>

  function fixtureKey(match){var teams=[match.home,match.away].map(function(team){return teamKey(team)}).sort();return [match.date||'',match.time||'',teams.join('|')].join('::')}
  function mergeFixture(existing,incoming){if((/J\. del Río/i.test(existing.label||'')&&/Ángel/i.test(incoming.label||''))||(/Ángel/i.test(existing.label||'')&&/J\. del Río/i.test(incoming.label||'')))existing.label='Benjamín · J. del Río · Ángel · Tercera Andaluza · Grupo 4';return existing}
  function loadData(){var today=todayKey(),fixtures=[],pending=calendars.length,sources=0,i;for(i=0;i<staticFixtures.length;i++)fixtures.push(staticFixtures[i]);function finish(){var week,j,m,d;if(pending!==0)return;week=chooseWeek(fixtures,today);setCountdown(week.matches);buildPages(week.matches);d=new Date();statusNode.innerHTML='Semana del '+esc(formatDay(week.start))+' al '+esc(formatDay(week.end))+' · Actualizado '+pad(d.getHours())+':'+pad(d.getMinutes())+' · '+sources+' calendarios'}for(i=0;i<calendars.length;i++){(function(config){requestJSON(config[0],function(data){var j,m;if(data&&data.matches&&typeof data.matches.length==='number'){sources++;for(j=0;j<data.matches.length;j++){m=data.matches[j];m.label=config[1];var key=fixtureKey(m),existing=null,k;for(k=0;k<fixtures.length;k++)if(fixtureKey(fixtures[k])===key){existing=fixtures[k];break}if(existing)mergeFixture(existing,m);else fixtures.push(m)}}pending--;finish()})})(calendars[i])}}
  updateClock();window.setInterval(updateClock,30000);window.setInterval(tickCountdown,1000);loadData();window.setInterval(loadData,300000);window.setInterval(function(){window.location.replace(window.location.pathname+'?tv-refresh='+Date.now())},900000);
})();
</script>
