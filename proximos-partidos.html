<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Próximos partidos | Atlético Zabal</title><link rel="icon" type="image/png" href="assets/escudo-zabal.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--navy:#173a6a;--ink:#10203a;--muted:#627895;--line:#c9d8ea;--soft:#edf4fb;--yellow:#f4c800}*{box-sizing:border-box}body{margin:0;font-family:Outfit,sans-serif;background:var(--soft);color:var(--ink)}a{color:inherit}.top{background:var(--navy);border-bottom:5px solid var(--yellow);color:white}.bar,.wrap{max-width:1040px;margin:auto;padding:18px}.bar{display:flex;justify-content:space-between}.brand,.back{text-decoration:none;font-weight:800}.brand,.brand:visited,.brand:hover,.brand:active{color:#fff!important;font-size:20px;letter-spacing:-.02em}.brand span{color:var(--yellow)!important}.back{color:#dce7f5}.wrap{padding-top:44px;padding-bottom:70px}.eyebrow{margin:0 0 8px;color:#486788;font-weight:800;letter-spacing:.12em;font-size:14px;text-transform:uppercase}h1{margin:0;font-size:clamp(38px,6vw,62px);letter-spacing:-.04em}.intro{color:var(--muted);font-size:18px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:28px 0 22px}.filters button{border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:#fff;color:var(--ink);font:700 14px Outfit;cursor:pointer}.filters button.active{background:var(--navy);color:white;border-color:var(--navy)}.day{margin-top:25px}.day h2{font-size:15px;letter-spacing:.1em;color:#486788;text-transform:uppercase}.fixture{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 18px;margin-top:9px}.date{text-align:center;font-weight:800;color:var(--navy);line-height:1}.date strong{display:block;font-size:28px}.team{font-size:13px;color:#486788;font-weight:800;text-transform:uppercase}.match{font-size:18px;font-weight:800}.meta{color:var(--muted);font-size:14px;margin-top:3px}.tag{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#edf4fb;color:#486788;font-size:12px;font-weight:800}.home{background:#fff4b0;color:#765f00}.empty,.loading{margin-top:25px;color:var(--muted)}@media(max-width:620px){.bar,.wrap{padding-left:14px;padding-right:14px}.fixture{grid-template-columns:1fr auto;gap:9px;padding:13px}.tag{white-space:nowrap}.match{font-size:16px}.date strong{font-size:23px}}.tv-link{display:inline-flex;align-items:center;border:1px solid var(--navy);border-radius:999px;padding:9px 14px;background:var(--yellow);color:var(--navy);font:700 14px Outfit;text-decoration:none}</style><link rel="stylesheet" href="assets/club-highlights.css"><script src="assets/club-highlights.js" defer></script></head><body><header class="top"><div class="bar"><a class="brand" href="index.html">atlético<span>zabal</span></a><a class="back" href="index.html">← Inicio</a></div></header><main class="wrap"><p class="eyebrow">Agenda del club</p><h1>Próximos partidos</h1><p class="intro">Todos los encuentros del Atlético Zabal Linense, ordenados por cercanía.</p><div class="filters"><button class="active" data-filter="all">Todos</button><button data-filter="home">Casa</button><button data-filter="away">Fuera</button><a class="tv-link" href="proximos-partidos-tv.html" target="_blank" rel="noopener">▣ Vista TV</a></div><p class="loading">Actualizando partidos oficiales…</p><p class="empty">No hay próximos partidos con este filtro.</p></main><script>
const main=document.querySelector('main.wrap'),empty=document.querySelector('.empty'),loading=document.querySelector('.loading');
const add=(p,t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;p.append(n);return n};
function filter(){const chosen=document.querySelector('.filters button.active').dataset.filter;let count=0;document.querySelectorAll('.day').forEach(day=>{let visible=0;day.querySelectorAll('.fixture').forEach(fixture=>{const show=chosen==='all'||fixture.dataset.side===chosen;fixture.style.display=show?'grid':'none';if(show){visible++;count++}});day.style.display=visible?'block':'none'});empty.style.display=count?'none':'block'}
document.querySelectorAll('.filters button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.filters button').forEach(other=>other.classList.remove('active'));button.classList.add('active');filter()}));
const today=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
const fixtures=[];
function isUpcoming(match){if(Array.isArray(match.score)||match.date<today)return false;if(match.date>today||!/^\d{2}:\d{2}$/.test(match.time||''))return true;const kickoff=new Date(match.date+'T'+match.time+':00');return Date.now()<kickoff.getTime()+2*60*60*1000}
function appendMatches(data,label){if(!Array.isArray(data.matches)||data.matches.length<2)throw Error('Calendario incompleto');data.matches.filter(isUpcoming).forEach(m=>fixtures.push({...m,label}))}
function render(){fixtures.sort((a,b)=>(a.date+' '+(a.time||'99:99')).localeCompare(b.date+' '+(b.time||'99:99')));const days=new Map;for(const match of fixtures){let section=days.get(match.date);if(!section){const date=new Date(match.date+'T12:00:00');section=add(main,'section','day');section.dataset.date=match.date;add(section,'h2','',new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(date));days.set(match.date,section);main.insertBefore(section,loading)}const home=/atl[eé]tico (zabal|atunara)|atunara atl[eé]tico/i.test(match.home);const article=add(section,'article','fixture');article.dataset.side=home?'home':'away';const info=add(article,'div','');add(info,'div','team',match.label);add(info,'div','match',match.home+' – '+match.away);add(info,'div','meta',(match.time||'Hora pendiente')+' · '+(match.ground||'Campo pendiente'));add(article,'span','tag'+(home?' home':''),(home?'🏠 CASA':'🚌 FUERA'))}}
const loadCalendar=path=>fetch(path,{cache:'no-store'}).then(response=>response.ok?response.json():Promise.reject());
Promise.all([
  loadCalendar('data/senior-rfaf.json'),loadCalendar('data/juvenil-dh-rfef.json'),loadCalendar('data/juvenil-b-rfaf.json'),
  loadCalendar('data/cadete-rfaf.json'),loadCalendar('data/cadete-b-rfaf.json'),loadCalendar('data/alevin-a-rfaf.json'),
  loadCalendar('data/alevin-c-rfaf.json'),loadCalendar('data/alevin-atunara-a-rfaf.json'),
  loadCalendar('data/alevin-zabal-c-rfaf.json'),loadCalendar('data/alevin-atunara-b-rfaf.json'),
  loadCalendar('data/infantil-a-rfaf.json'),loadCalendar('data/benjamin-a-rfaf.json'),
  loadCalendar('data/benjamin-b-rfaf.json')
]).then(([senior,juvenil,juvenilB,cadeteA,cadeteB,alevinA,alevinC,alevinAtunara,alevinZabalC,alevinAtunaraB,infantilA,benjaminA,benjaminB])=>{
  appendMatches(senior,'Sénior · Tercera Andaluza · Grupo único');
  appendMatches(juvenil,'Juvenil · División de Honor · Grupo 4');
  appendMatches(juvenilB,'Juvenil B · Cuarta Andaluza · Grupo 4');
  appendMatches(cadeteA,'Cadete A · Segunda Andaluza · Grupo único');
  appendMatches(cadeteB,'Cadete · Machuca · Tercera Andaluza · Grupo 2');
  appendMatches(infantilA,'Infantil A · Segunda Andaluza · Grupo único');
  appendMatches(alevinA,'Alevín A · Segunda Andaluza · Grupo único');
  appendMatches(alevinC,'Alevín · Berrocal · Tercera Andaluza · Grupo 4');
  appendMatches(alevinAtunara,'Alevín Atunara A · Cristian · Tercera Andaluza · Grupo 4');
  appendMatches(alevinZabalC,'Alevín · David · Tercera Andaluza · Grupo 5');
  appendMatches(alevinAtunaraB,'Alevín Atunara B · Adrián · Tercera Andaluza · Grupo 5');
  appendMatches(benjaminA,'Benjamín A · Segunda Andaluza · Grupo único');
  appendMatches(benjaminB,'Benjamín · J. del Río · Tercera Andaluza · Grupo 4');
  render();loading.remove();filter();
}).catch(()=>{loading.textContent='Los calendarios oficiales se están actualizando. Vuelve a intentarlo en unos minutos.';filter()});
filter();
</script></body></html>
