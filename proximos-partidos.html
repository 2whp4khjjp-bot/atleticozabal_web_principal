 #b18d00;outline-offset:2px}.other-links{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 15px}.tv-link,.results-link{display:inline-flex;align-items:center;border:1px solid var(--navy);border-radius:999px;padding:8px 12px;font:700 12px Outfit;text-decoration:none}.tv-link{background:var(--yellow);color:var(--navy)}.results-link{background:var(--navy);color:#fff}.count{font-size:12px;color:var(--muted);font-weight:700}.day{margin-top:19px}.day h2{font-size:12px;letter-spacing:.08em;color:#536e8b;text-transform:uppercase;margin:0 0 8px}.fixture{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:7px;box-shadow:0 3px 12px #15375e09}.fixture.home{border-left:6px solid var(--yellow)}.fixture.away{border-left:6px solid var(--navy)}.fixture-top{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:10px 13px 7px}.category{font-size:20px;line-height:1;font-weight:900;letter-spacing:-.035em;color:var(--navy)}.sub{font-size:10px;font-weight:500;color:var(--muted);margin-top:3px}.venue{flex-shrink:0;background:var(--yellow);color:var(--navy);border-radius:2px;padding:3px 5px;font-size:9px;font-weight:800}.fixture.away .venue{background:var(--navy);color:white}.fixture-center{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 13px 7px}.teams{min-width:0;display:flex;align-items:center;gap:5px;flex-wrap:wrap}.team-name{font-size:15px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}.team-name.zabal{color:var(--yellow);background:var(--navy);padding:1px 5px 0;border-radius:3px;line-height:1.05}.vs{font-size:10px;color:#8195ab;font-weight:800}.kickoff{font-size:28px;font-weight:900;color:var(--navy);white-space:nowrap;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.kickoff.pending{font-size:11px;line-height:1.1;white-space:normal;max-width:67px;text-align:right;letter-spacing:0}.result{display:flex;gap:4px;align-items:center;justify-content:flex-end;color:var(--navy);font-size:24px;font-weight:900;white-space:nowrap;line-height:1;font-variant-numeric:tabular-nums}.result .symbol{font-size:19px}.fixture-bottom{border-top:1px solid #e8edf3;padding:6px 13px;display:flex;align-items:center;gap:8px;justify-content:space-between;background:#f9fbfe}.location{min-width:0;font-size:10px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.official-link{flex-shrink:0;background:var(--navy);color:white!important;text-decoration:none;padding:5px 7px;border-radius:6px;font-size:10px;font-weight:800;white-space:nowrap}.empty,.loading{margin-top:20px;color:var(--muted)}.empty{display:none}@media(min-width:650px){.filters{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:end}}@media(max-width:620px){.bar,.wrap{padding-left:13px;padding-right:13px}.category{font-size:18px}.team-name{font-size:13px}.kickoff{font-size:25px}.result{font-size:21px}.result .symbol{font-size:16px}.fixture-center{gap:5px}.intro{font-size:14px}}</style><link rel="stylesheet" href="assets/club-highlights.css"><script src="assets/club-highlights.js" defer></script></head><body><header class="topbar"><div class="bar"><a class="brand" href="index.html">atlético<span>zabal</span></a><a class="back" href="index.html">← Inicio</a></div></header>
<main class="wrap">
<p class="eyebrow">Agenda del club</p>
<h1>Partidos de la semana</h1>
<p class="intro">Todos los encuentros de la semana en curso, incluidos los ya disputados y sus resultados.</p>
<div class="filters"><div><div class="filter-title">Categoría</div><div class="category-buttons" role="group" aria-label="Filtrar categorías"><button type="button" data-category="all" class="active" aria-pressed="true">Todas</button><button type="button" data-category="Sénior" aria-pressed="false">Sénior</button><button type="button" data-category="Juvenil" aria-pressed="false">Juvenil</button><button type="button" data-category="Cadete" aria-pressed="false">Cadete</button><button type="button" data-category="Infantil" aria-pressed="false">Infantil</button><button type="button" data-category="Alevín" aria-pressed="false">Alevín</button><button type="button" data-category="Benjamín" aria-pressed="false">Benjamín</button><button type="button" data-category="Prebenjamín" aria-pressed="false">Prebenjamín</button><button type="button" data-category="Bebé" aria-pressed="false">Bebé</button></div></div><div><div class="filter-title">Dónde juegan</div><div class="seg" role="group" aria-label="Filtrar localía"><button type="button" class="active" data-side="all" aria-pressed="true">Todos</button><button type="button" data-side="home" aria-pressed="false">Casa</button><button type="button" data-side="away" aria-pressed="false">Fuera</button></div></div></div><div class="other-links"><a class="results-link" href="resultados-anteriores.html">↶ Resultados anteriores</a><a class="tv-link" href="proximos-partidos-tv.html" target="_blank" rel="noopener">▣ Vista TV</a></div><p class="count" aria-live="polite"></p><p class="loading">Actualizando partidos oficiales…</p><p class="empty">No hay partidos esta semana con este filtro.</p></main><script>
const main=document.querySelector('main.wrap'),empty=document.querySelector('.empty'),loading=document.querySelector('.loading');
const add=(p,t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;p.append(n);return n};
let selectedSide='all';const selectedCategories=new Set(),count=document.querySelector('.count');function filter(){let total=0;document.querySelectorAll('.day').forEach(day=>{let visible=0;day.querySelectorAll('.fixture').forEach(card=>{const show=(!selectedCategories.size||selectedCategories.has(card.dataset.category))&&(selectedSide==='all'||card.dataset.side===selectedSide);card.style.display=show?'block':'none';if(show){visible++;total++}});day.style.display=visible?'block':'none'});count.textContent=total+' partido'+(total===1?'':'s')+' esta semana';empty.style.display=total?'none':'block'}document.querySelectorAll('[data-category]').forEach(button=>button.addEventListener('click',()=>{const value=button.dataset.category;if(value==='all')selectedCategories.clear();else if(selectedCategories.has(value))selectedCategories.delete(value);else selectedCategories.add(value);document.querySelectorAll('[data-category]').forEach(item=>{const active=item.dataset.category==='all'?!selectedCategories.size:selectedCategories.has(item.dataset.category);item.classList.toggle('active',active);item.setAttribute('aria-pressed',String(active))});filter()}));document.querySelectorAll('[data-side]').forEach(button=>button.addEventListener('click',()=>{selectedSide=button.dataset.side;document.querySelectorAll('[data-side]').forEach(item=>{const active=item===button;item.classList.toggle('active',active);item.setAttribute('aria-pressed',String(active))});filter()}));
const fixtures=[];
const dateKey=date=>date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
const now=new Date(),monday=new Date(now),sunday=new Date(now);monday.setHours(12,0,0,0);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));sunday.setTime(monday.getTime());sunday.setDate(sunday.getDate()+6);const weekStart=dateKey(monday),weekEnd=dateKey(sunday);
function isThisWeek(match){return /^\d{4}-\d{2}-\d{2}$/.test(match.date||'')&&match.date>=weekStart&&match.date<=weekEnd}
function fixtureKey(match){const teams=[match.home,match.away].map(team=>String(team||'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim()).sort();return [match.date||'',match.time||'',teams.join('|')].join('::')}
function mergeFixture(existing,incoming){const combined='Benjamín · J. del Río · Ángel · Tercera Andaluza · Grupo 4';if(!existing.actaUrl&&incoming.actaUrl)existing.actaUrl=incoming.actaUrl;if(!Array.isArray(existing.score)&&Array.isArray(incoming.score))existing.score=incoming.score;if(/J\. del Río/i.test(existing.label||'')&&/Ángel/i.test(incoming.label||''))existing.label=combined;return existing}
function appendMatches(data,label){if(!Array.isArray(data.matches)||data.matches.length<2)return;data.matches.filter(isThisWeek).forEach(m=>{const key=fixtureKey(m),existing=fixtures.find(item=>fixtureKey(item)===key);if(existing){mergeFixture(existing,{...m,label});return}fixtures.push({...m,label})})}
const clubName=name=>/atl[eé]tico\s+(zabal|atunara)|atunara\s+atl[eé]tico/i.test(name||'');function categoryOf(label){const name=String(label||'').trim();const categories=['Prebenjamín','Benjamín','Alevín','Infantil','Cadete','Juvenil','Bebé','Sénior'];return categories.find(category=>name.toLocaleLowerCase('es').startsWith(category.toLocaleLowerCase('es')))||'Sénior'}function categoryTitle(label){const parts=String(label||'').split(' · ');const cat=categoryOf(label);const first=parts[0];let suffix='';if(/^(Juvenil|Cadete|Infantil|Benjamín|Prebenjamín|Alevín|Bebé) [A-C]$/i.test(first))suffix=' '+first.split(' ').at(-1);else if(/División de Honor/i.test(label))suffix=' DIVISIÓN DE HONOR';else if(/Femenino/i.test(first))suffix=' FEMENINO';else if(/Atunara/i.test(first))suffix=' ATUNARA'+(first.match(/\b[A-C]\b/)?.[0]?' '+first.match(/\b[A-C]\b/)?.[0]:'');return (cat+suffix).toLocaleUpperCase('es')}function render(){fixtures.sort((a,b)=>(a.date+' '+(a.time||'99:99')).localeCompare(b.date+' '+(b.time||'99:99')));const days=new Map();for(const match of fixtures){let section=days.get(match.date);if(!section){const date=new Date(match.date+'T12:00:00');section=add(main,'section','day');section.dataset.date=match.date;add(section,'h2','',new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(date));days.set(match.date,section);main.insertBefore(section,loading)}const home=clubName(match.home),category=categoryOf(match.label),article=add(section,'article','fixture '+(home?'home':'away'));article.dataset.side=home?'home':'away';article.dataset.category=category;const top=add(article,'div','fixture-top'),heading=add(top,'div','');add(heading,'div','category',categoryTitle(match.label));add(heading,'div','sub',match.label);add(top,'span','venue',home?'LOCAL':'VISITA');const center=add(article,'div','fixture-center'),teams=add(center,'div','teams');add(teams,'span','team-name'+(clubName(match.home)?' zabal':''),match.home);add(teams,'span','vs','VS');add(teams,'span','team-name'+(clubName(match.away)?' zabal':''),match.away);const score=match.score;if(Array.isArray(score)&&score.length===2&&score.every(n=>n!==null&&n!==undefined&&String(n).trim()!==''&&Number.isFinite(Number(n)))){const ours=Number(score[home?0:1]),theirs=Number(score[home?1:0]),result=add(center,'div','result');add(result,'span','',score.join('–'));add(result,'span','symbol',ours>theirs?'✅':ours<theirs?'❌':'🟰');result.setAttribute('aria-label','Resultado '+score.join(' a ')+'; '+(ours>theirs?'victoria':ours<theirs?'derrota':'empate'))}else add(center,'div','kickoff'+(match.time?'':' pending'),match.time||'Hora pendiente');const bottom=add(article,'div','fixture-bottom');const location=add(bottom,'span','location',match.ground||'Campo pendiente');location.title=match.ground||'Campo pendiente';if(match.actaUrl){const acta=add(bottom,'a','official-link','Acta ↗');acta.href=match.actaUrl;acta.target='_blank';acta.rel='noopener'}}}
const loadCalendar=path=>fetch(path,{cache:'no-store'}).then(response=>response.ok?response.json():Promise.reject());
Promise.all([
  loadCalendar('data/senior-rfaf.json'),loadCalendar('data/juvenil-dh-rfef.json'),loadCalendar('data/juvenil-b-rfaf.json'),
  loadCalendar('data/cadete-rfaf.json'),loadCalendar('data/cadete-b-rfaf.json'),loadCalendar('data/cadete-femenino-rfaf.json'),loadCalendar('data/alevin-a-rfaf.json'),
  loadCalendar('data/alevin-c-rfaf.json'),loadCalendar('data/alevin-atunara-a-rfaf.json'),loadCalendar('data/alevin-atunara-4a-rfaf.json'),
  loadCalendar('data/alevin-zabal-c-rfaf.json'),loadCalendar('data/alevin-atunara-b-rfaf.json'),
  loadCalendar('data/infantil-a-rfaf.json'),loadCalendar('data/infantil-b-rfaf.json'),loadCalendar('data/benjamin-a-rfaf.json'),
  loadCalendar('data/benjamin-b-rfaf.json'),loadCalendar('data/benjamin-sebas-rfaf.json'),loadCalendar('data/benjamin-angel-rfaf.json'),loadCalendar('data/benjamin-javi-martin-rfaf.json')
]).then(([senior,juvenil,juvenilB,cadeteA,cadeteB,cadeteFemenino,alevinA,alevinC,alevinAtunara,alevinAtunara4a,alevinZabalC,alevinAtunaraB,infantilA,infantilB,benjaminA,benjaminB,benjaminSebas,benjaminAngel,benjaminJaviMartin])=>{
  appendMatches(senior,'Sénior · Tercera Andaluza · Grupo único');
  appendMatches(juvenil,'Juvenil · División de Honor · Grupo 4');
  appendMatches(juvenilB,'Juvenil B · Cuarta Andaluza · Grupo 4');
  appendMatches(cadeteA,'Cadete A · Segunda Andaluza · Grupo único');
  appendMatches(cadeteB,'Cadete B · Tercera Andaluza · Grupo 4');
  appendMatches(cadeteFemenino,'Cadete Femenino · 3ª Andaluza Femenina · Grupo único');
  appendMatches(infantilA,'Infantil A · Segunda Andaluza · Grupo único');
  appendMatches(infantilB,'Infantil B · Tercera Andaluza · Grupo 5');
  appendMatches(alevinA,'Alevín A · Segunda Andaluza · Grupo único');
  appendMatches(alevinC,'Alevín · Berrocal · Tercera Andaluza · Grupo 4');
  appendMatches(alevinAtunara,'Alevín Atunara A · Cristian · Tercera Andaluza · Grupo 4');
  appendMatches(alevinAtunara4a,'Alevín Atunara Sergio · 4.ª Andaluza · Grupo 4');
  appendMatches(alevinZabalC,'Alevín · David · Tercera Andaluza · Grupo 5');
  appendMatches(alevinAtunaraB,'Alevín Atunara B · Adrián · Tercera Andaluza · Grupo 5');
  appendMatches(benjaminA,'Benjamín A · Segunda Andaluza · Grupo único');
  appendMatches(benjaminB,'Benjamín · J. del Río · Tercera Andaluza · Grupo 4');
  appendMatches(benjaminSebas,'Benjamín · Sebas · Tercera Andaluza · Grupo 5');
  appendMatches(benjaminAngel,'Benjamín · Ángel · Tercera Andaluza · Grupo 4');
  appendMatches(benjaminJaviMartin,'Benjamín · Javi Martin · 4.ª Andaluza · Grupo 4');
  extraFeedsLoaded.then(()=>{render();loading.remove();filter()});
}).catch(()=>{loading.textContent='Los calendarios oficiales se están actualizando. Vuelve a intentarlo en unos minutos.';filter()});

const extraFeedsLoaded=Promise.allSettled([loadCalendar('data/prebenjamin-polo-rfaf.json').then(data=>appendMatches(data,"Prebenjamín · Polo")),
loadCalendar('data/prebenjamin-c-rfaf.json').then(data=>appendMatches(data,"Prebenjamín C")),
loadCalendar('data/prebenjamin-a-rfaf.json').then(data=>appendMatches(data,"Prebenjamín A")),
loadCalendar('data/prebenjamin-b-rfaf.json').then(data=>appendMatches(data,"Prebenjamín B")),
loadCalendar('data/alevin-atunara-mariano-rfaf.json').then(data=>appendMatches(data,"Alevín Atunara · Mariano")),
loadCalendar('data/bebe-a-rfaf.json').then(data=>appendMatches(data,"Bebé A")),
loadCalendar('data/bebe-b-rfaf.json').then(data=>appendMatches(data,"Bebé B"))]).then(()=>{});
filter();
</script></body></html>
